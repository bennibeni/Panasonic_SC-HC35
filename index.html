<!doctype html>
<html lang="it" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Guida navigabile in italiano per lo stereo Panasonic SC-HC35.">
  <title>Panasonic SC-HC35 · Guida all’uso</title>
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem('panasonic-theme') || 'light'; } catch {}
  </script>
  <link rel="stylesheet" href="stile.css">
  <script defer src="data.js"></script>
  <script defer src="guida.js"></script>
</head>
<body>
  <a class="skip" href="#contenuto" data-skip>Vai al contenuto</a>
  <div class="shell">
    <aside class="side" id="indice">
      <div class="brand"><small>Panasonic · Guida all’uso</small><a href="#inizio">SC-HC35</a></div>
      <div class="tools">
        <button id="tema" type="button" aria-pressed="false">Tema scuro</button>
        <a href="manuale.pdf" target="_blank" rel="noopener">Manuale PDF ↗</a>
      </div>
      <label for="ricerca" class="visually-hidden">Cerca nella guida</label>
      <input id="ricerca" type="search" placeholder="Cerca nella guida" autocomplete="off">
      <div id="esiti" class="visually-hidden" role="status"></div>
      <nav id="capitoli" aria-label="Capitoli della guida"></nav>
      <button id="chiudi-indice" type="button">Chiudi indice</button>
    </aside>
    <div class="main">
      <header class="topbar">
        <button id="apri-indice" type="button" aria-controls="indice" aria-expanded="false">☰ Indice</button>
        <b>SC-HC35</b>
      </header>
      <div class="progress" aria-hidden="true"><span id="avanzamento"></span></div>
      <main class="page" id="contenuto" tabindex="-1"></main>
      <noscript>Per navigare nella guida abilita JavaScript. <a href="manuale.pdf">Apri il manuale originale.</a></noscript>
      <footer><a href="https://links-page-bennibeni.vercel.app/">All projects</a></footer>
    </div>
  </div>
  <button class="scrim" type="button" tabindex="-1" aria-label="Chiudi indice" hidden></button>
  <dialog id="zoom" aria-labelledby="didascalia-zoom">
    <form method="dialog"><button autofocus>Chiudi ✕</button></form>
    <img id="immagine-zoom" alt="">
    <p id="didascalia-zoom"></p>
  </dialog>
</body>
</html>
